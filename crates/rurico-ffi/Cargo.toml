[package]
name = "rurico-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Safe FFI wrappers for rurico (mlx-sys, sqlite-vec)"
license = "MIT"
publish = false

[features]
default = ["mlx"]
mlx = ["dep:mlx-sys"]

[dependencies]
mlx-sys = { workspace = true, optional = true }
rusqlite = { workspace = true }
sqlite-vec = { workspace = true }

[lints]
workspace = true
