name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest
          enable-cache: false

      - name: Verify Python reference environment
        shell: bash
        run: |
          reference_env=$(mktemp -d "$RUNNER_TEMP/rurico-reference.XXXXXX")
          # setup-python has no macOS arm64 distribution for Python 3.12.13.
          uv venv --python 3.12.13 --managed-python --no-project --seed "$reference_env"
          "$reference_env/bin/python" -m pip install -r docs/research/issue-307/requirements.txt
          "$reference_env/bin/python" -m pip check
          "$reference_env/bin/python" -c 'import sys; sys.path.insert(0, "docs/research/issue-307"); import reference; reference.environment()'
          "$reference_env/bin/python" -m unittest discover -s docs/research/issue-307 -p 'test_*.py'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          # Exclude old caches without the runtime Metal library, including fallback restores.
          key: mlx-metallib-v1
          # mlx-sys 0.6 builds ~/.mlx/lib/<source-key>/mlx.metallib outside target.
          cache-directories: ~/.mlx/lib

      - name: Check
        run: cargo check --locked --workspace --features test-support,test-mlx,smoke

      - name: Install nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest

      - name: Test
        run: |
          python3 -m unittest discover -b -s scripts -p 'test_*.py'
          bash scripts/test.sh

      - name: Doctests
        run: cargo test --locked --doc --workspace --features test-support,test-mlx,smoke

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Format check
        run: cargo fmt -- --check

  coverage:
    # Gate changed-line coverage, not overall coverage. Match the test job's features.
    # MLX requires macOS Apple Silicon, including for model-free tests.
    runs-on: macos-latest
    timeout-minutes: 60
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          # Exclude old caches without the runtime Metal library, including fallback restores.
          key: mlx-metallib-v1
          # Keep the Metal library with this job's instrumented Cargo artifacts.
          cache-directories: ~/.mlx/lib

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov

      - name: Generate lcov coverage
        run: |
          # Retain exclusions for test-support mocks, MLX inference, smoke bins,
          # live HF Hub I/O and the cached-model memory observer. Model-free smoke
          # tests run in the normal lane; enabling smoke does not run ignored inference.
          # Pure logic and the observer's injection/lifetime checks remain measured.
          # See CONTRIBUTING.md for the separate host observer run.
          cargo llvm-cov --workspace --features test-support,test-mlx,smoke \
            --ignore-filename-regex '(test_support\.rs|/bin/|embed/(mlx|embedder)\.rs|reranker/mlx\.rs|model_io/hf_backend\.rs|/mlx_cache/testing/runtime\.rs$)' \
            --lcov --output-path lcov.info

      - name: Diff coverage gate (changed lines >= 95%)
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          # A venv avoids PEP 668 restrictions on the runner's Python.
          python3 -m venv /tmp/diff-cover-venv
          /tmp/diff-cover-venv/bin/pip install --quiet diff-cover
          /tmp/diff-cover-venv/bin/diff-cover lcov.info \
            --compare-branch=origin/main \
            --fail-under=95

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-targets: false

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Deny check
        run: cargo deny check

      - name: Audit
        run: cargo audit
